server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy WebSocket → backend container
    location /ws {
        proxy_pass         http://battleship-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # Proxy API REST → backend container (routes directes du serveur Go)
    location ~ ^/(rooms|leaderboard) {
        proxy_pass       http://battleship-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA : toutes les autres routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

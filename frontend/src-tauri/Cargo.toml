[package]
name = "battleship"
version = "0.1.0"
edition = "2021"

[lib]
name = "battleship_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = [] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bluest      = "0.6"
tokio       = { version = "1", features = ["full"] }
uuid        = { version = "1" }
futures     = "0.3"
tauri-plugin-shell = "2.3.5"
